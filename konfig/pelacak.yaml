# Pelacak untuk kamera diam. Dasar: botsort bawaan Ultralytics.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 90 # frame yang diproses (semua frame, 25 fps); lintasan hilang ditahan sekitar 3-4 detik
match_thresh: 0.8
fuse_score: True
gmc_method: none # kamera tidak bergerak, kompensasi gerak kamera tidak perlu
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: True # cocokkan tampilan saat kendaraan muncul lagi setelah tertutup
model: auto
