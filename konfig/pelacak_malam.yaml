# Pelacak untuk malam: ambang lebih rendah supaya kendaraan yang samar tetap mulai dilacak.
tracker_type: botsort
track_high_thresh: 0.12
track_low_thresh: 0.05
new_track_thresh: 0.12
track_buffer: 90 # frame yang diproses (semua frame, 25 fps); lintasan hilang ditahan sekitar 3-4 detik
match_thresh: 0.8
fuse_score: True
gmc_method: none
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: True
model: auto
